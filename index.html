<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#3E8C28" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="المزارع شايف" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="description" content="مزرعة ومدينة 2.5D: ازرع، صنّع، بِع، وسلّم الطلبات" />
  <title>المزارع شايف</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="img/icon-192.png" />
  <link rel="apple-touch-icon" href="img/icon-180.png" />
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="app">
    <div id="stage">
      <section id="menu" class="screen menu-screen">
        <img src="img/menu-bg.jpg" alt="" class="menu-bg" />
        <div class="menu-veil" aria-hidden="true"></div>
        <div class="menu-sun" aria-hidden="true"></div>
        <div class="menu-dust" aria-hidden="true"></div>
        <img src="img/shayef.png" alt="المزارع شايف" class="menu-hero" />
        <div class="menu-panel">
          <p class="kicker">مزرعة ومدينة · 2.5D بالعرض</p>
          <h1>المزارع شايف</h1>
          <p class="tagline">ازرع · صنّع · بِع · سلّم · ابنِ قريتك</p>
          <div class="menu-actions">
            <button id="btn-start" class="btn btn-play" type="button">ابدأ اللعبة</button>
            <button id="btn-menu-settings" class="btn btn-menu" type="button">الإعدادات</button>
          </div>
          <p class="hint" id="splash-hint">أفضل تجربة: هاتفك بالعرض</p>
        </div>
      </section>

      <section id="game" class="screen hidden">
        <canvas id="view"></canvas>
        <header class="hud">
          <div class="chips">
            <button class="chip coin" id="chip-coins" type="button"><span class="ico">🪙</span><span class="chip-lab">ذهب</span><b id="hud-coins">0</b></button>
            <button class="chip gem" id="chip-gems" type="button"><span class="ico">💎</span><b id="hud-gems">0</b></button>
          </div>
          <div class="xp"><div class="xp-bar"><i id="xp-fill"></i></div><small id="xp-label">0 / 20</small></div>
          <button class="lvl" id="chip-level" type="button"><span>مستوى</span><strong id="hud-level">1</strong></button>
          <div class="hud-clock" id="hud-clock">النهار</div>
          <button class="gear" id="btn-settings" type="button" aria-label="إعدادات">⚙</button>
        </header>
        <div id="quest-track" class="quest-track hidden"></div>
        <nav id="dock" class="dock" aria-label="القوائم">
          <button type="button" data-dock="craft"><span>🏭</span><small>تصنيع</small></button>
          <button type="button" data-dock="shop"><span>🛒</span><small>السوق</small></button>
          <button type="button" data-dock="quests"><span>📜</span><small>مهام</small></button>
          <button type="button" data-dock="barn"><span>📦</span><small>المخزن</small></button>
        </nav>
        <div id="speech" class="speech hidden"></div>
        <div id="seed-tray" class="seed-tray" data-hud="tray"></div>
        <div id="joy" class="joy" data-hud="joy"><div class="joy-base"><div class="joy-knob" id="joy-knob"></div></div></div>
        <button id="btn-act" class="act" type="button" data-hud="act"><span id="act-ico">✋</span><small id="act-lab">تفاعل</small></button>
        <div id="layout-bar" class="layout-bar hidden">
          <span>اسحب الجويستك وزر الفعل والبذور</span>
          <button id="btn-layout-done" class="btn tiny" type="button">تم</button>
        </div>
      </section>

      <aside id="panel" class="panel hidden">
        <div class="panel-head">
          <h2 id="panel-title">المتجر</h2>
          <button id="panel-close" class="icon-btn" type="button" aria-label="إغلاق">✕</button>
        </div>
        <div id="panel-body" class="panel-body"></div>
      </aside>
      <div id="sheet" class="sheet hidden" role="dialog">
        <div class="sheet-bg" data-close="sheet"></div>
        <div class="sheet-card"><div class="grab"></div><div id="sheet-body"></div></div>
      </div>
      <div id="modal" class="modal hidden" role="dialog">
        <div class="modal-bg" data-close="modal"></div>
        <div class="modal-card" id="modal-card"></div>
      </div>
      <div id="settings" class="settings hidden" role="dialog">
        <div class="settings-bg" data-close="settings"></div>
        <div class="settings-card">
          <div class="settings-head">
            <h2>الإعدادات</h2>
            <button class="icon-btn" type="button" data-close="settings" aria-label="إغلاق">✕</button>
          </div>
          <div class="set-sec">
            <h3>الصوت</h3>
            <label class="set-row">
              <span>الموسيقى</span>
              <input id="vol-music" type="range" min="0" max="100" value="40" />
              <button id="tog-music" class="btn tiny" type="button">تشغيل</button>
            </label>
            <label class="set-row">
              <span>المؤثرات</span>
              <input id="vol-sfx" type="range" min="0" max="100" value="70" />
              <button id="tog-sfx" class="btn tiny" type="button">تشغيل</button>
            </label>
          </div>
          <div class="set-sec">
            <h3>الأزرار</h3>
            <label class="set-row">
              <span>حجم الأزرار</span>
              <input id="ctrl-scale" type="range" min="70" max="140" value="100" />
              <b id="ctrl-scale-lab">100%</b>
            </label>
            <div class="set-row">
              <span>الجويستك</span>
              <div class="seg mini" id="joy-side">
                <button type="button" data-side="left" class="on">يسار</button>
                <button type="button" data-side="right">يمين</button>
              </div>
            </div>
            <div class="set-actions">
              <button id="btn-layout-edit" class="btn btn-ghost" type="button">تعديل مواقع الأزرار</button>
              <button id="btn-layout-reset" class="btn btn-ghost" type="button">إعادة ضبط المواقع</button>
            </div>
          </div>
          <div class="set-foot">
            <button id="btn-to-menu" class="btn btn-ghost hidden" type="button">القائمة الرئيسية</button>
            <button class="btn" type="button" data-close="settings">تم</button>
            <button id="btn-reset" class="btn btn-danger" type="button">إعادة تعيين المزرعة</button>
          </div>
        </div>
      </div>
      <div id="toasts" class="toasts"></div>
      <div id="fx" class="fx"></div>
    </div>
    <div id="rotate">
      <img src="img/shayef.png" alt="">
      <p>حرّك هاتفك <b>بالعرض</b> عشان المزرعة تتوسع</p>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
